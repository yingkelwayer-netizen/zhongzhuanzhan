name: Deploy to Aliyun ECS (Baota)

on:
  push:
    branches:
      - main # 监听 main 分支的推送

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码 (Checkout)
      uses: actions/checkout@v7.0.1

    - name: 设置 Node.js 环境
      uses: actions/setup-node@v7.0.0
      with:
        node-version: '24'

    - name: 运行发布前测试
      run: npm test

    - name: 编译生成静态网页
      run: node build.js

    - name: 部署到阿里云 ECS
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_IP }}
        username: root
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        source: "index.html,about.html,services.html,insights.html,contact.html,privacy.html,style.css,robots.txt,sitemap.xml,assets/"
        target: "/www/wwwroot/zhongzhuanzhan"

    # Nginx、证书与 HTTPS 跳转由宝塔站点配置统一管理。
    # 部署流程只同步静态文件，避免每次发布覆盖面板保存的 SSL 配置。
