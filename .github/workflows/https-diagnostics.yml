name: Diagnose HTTPS configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect Baota Nginx and certificate metadata
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -u

            nginx_bin="/www/server/nginx/sbin/nginx"
            if [ ! -x "$nginx_bin" ]; then
              nginx_bin="$(command -v nginx || true)"
            fi

            echo "=== System ==="
            uname -a
            [ -f /etc/os-release ] && sed -n '1,12p' /etc/os-release
            echo "NGINX_BIN=${nginx_bin:-missing}"

            for domain in zonghuin.com niuzonghui.com; do
              echo "=== ${domain}: Nginx configuration ==="
              conf="/www/server/panel/vhost/nginx/${domain}.conf"
              if [ -f "$conf" ]; then
                echo "CONF=$conf"
                grep -nE '^[[:space:]]*(listen|server_name|root|ssl_certificate|ssl_certificate_key|return[[:space:]]+30[18])' "$conf" || true
              else
                echo "CONF_MISSING=$conf"
              fi

              echo "=== ${domain}: certificate metadata ==="
              cert_dir="/www/server/panel/vhost/cert/${domain}"
              if [ ! -d "$cert_dir" ]; then
                echo "CERT_DIR_MISSING=$cert_dir"
                continue
              fi

              find "$cert_dir" -maxdepth 1 -type f \( -name '*.pem' -o -name '*.crt' \) -print | sort | while IFS= read -r cert_file; do
                if grep -q 'BEGIN CERTIFICATE' "$cert_file" 2>/dev/null; then
                  echo "CERT_FILE=$cert_file"
                  openssl x509 -in "$cert_file" -noout -subject -issuer -serial -dates -fingerprint -sha256 -ext subjectAltName 2>&1 || true
                fi
              done
            done

            echo "=== Nginx syntax ==="
            if [ -n "${nginx_bin:-}" ]; then
              "$nginx_bin" -t
            else
              echo "Nginx binary not found"
              exit 1
            fi
